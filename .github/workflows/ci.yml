# Runs `just ci` (the justfile is the single source of truth for checks).
#
# Pull requests run every workflow without path filters: `rust`, `plans` and
# `web` are required checks on main, and a workflow skipped by a path filter
# would leave its check pending forever.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!.agents/**"
      - "!**/*.md"
      # The website has its own workflow (web.yml).
      - "!web/**"
      # Generated from code; a hand edit must still fail the IA test.
      - "docs/ia/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libssl-dev libzstd-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev
      # With no argument rustup installs what rust-toolchain.toml pins
      # (the channel plus clippy and rustfmt).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just ci
