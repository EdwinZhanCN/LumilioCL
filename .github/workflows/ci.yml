# Runs `just ci` (the justfile is the single source of truth for checks).
#
# `rust`, `plans` and `web` are required checks on main. A workflow that a
# path filter never starts leaves its check pending forever, but a skipped job
# counts as passed. So pull requests always start the workflow, and the
# `changes` job decides whether the check runs. If `changes` fails, the check
# runs anyway. Pushes to main filter in `on.push.paths`.
name: CI

on:
  push:
    branches: [main]
    # Keep in sync with the filters in the `changes` job.
    paths:
      - "**"
      - "!.agents/**"
      - "!**/*.md"
      # The website has its own workflow (web.yml).
      - "!web/**"
      # Generated from code; a hand edit must still fail the IA test.
      - "docs/ia/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.ia == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # A file matches `code` only when it matches every pattern.
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!.agents/**"
              - "!**/*.md"
              - "!web/**"
            ia:
              - "docs/ia/**"

  rust:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libssl-dev libzstd-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev
      # With no argument rustup installs what rust-toolchain.toml pins
      # (the channel plus clippy and rustfmt).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just ci
