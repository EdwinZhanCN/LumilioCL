[workspace]
members = [
    "crates/lumilio-app",
    "crates/lumilio-core",
    "crates/lumilio-docgen",
    "crates/lumilio-ui",
    "crates/lumilio-plugin-api",
    "crates/lumilio-nbt",
    "crates/lumilio-anvil",
    "crates/lumilio-plugin-crash-analyzer",
    "crates/lumilio-plugin-litematica",
    "crates/lumilio-plugin-modrinth",
    "crates/lumilio-plugin-discord",
    "crates/lumilio-schematic-render",
    "crates/lumilio-skin-render",
    "crates/lumilio-pointer",
    "crates/lumilio-cubiomes",
    "crates/lumilio-map-render",
    "crates/lumilio-plugin-world-explorer",
    "crates/lumilio-xtask",
]
resolver = "3"
exclude = ["forks/nucleation", "forks/schematic-mesher", "forks/gpui-component"]

[patch.crates-io]
gpui-component = { path = "forks/gpui-component" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.95"
license = "AGPL-3.0-only"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = "0.7.0"
gpui-kit = { version = "0.7.0", default-features = false, features = ["component", "assets"] }
base64 = "0.22"
flate2 = "1"
futures-util = "0.3.34"
getrandom = "0.3"
keyring = "4.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lumilio-core = { path = "crates/lumilio-core" }
lumilio-plugin-api = { path = "crates/lumilio-plugin-api" }
lumilio-plugin-crash-analyzer = { path = "crates/lumilio-plugin-crash-analyzer" }
lumilio-plugin-litematica = { path = "crates/lumilio-plugin-litematica" }
lumilio-plugin-modrinth = { path = "crates/lumilio-plugin-modrinth" }
lumilio-plugin-discord = { path = "crates/lumilio-plugin-discord" }
lumilio-nbt = { path = "crates/lumilio-nbt" }
lumilio-anvil = { path = "crates/lumilio-anvil" }
lumilio-schematic-render = { path = "crates/lumilio-schematic-render" }
lumilio-skin-render = { path = "crates/lumilio-skin-render" }
lumilio-pointer = { path = "crates/lumilio-pointer" }
lumilio-map-render = { path = "crates/lumilio-map-render" }
lumilio-cubiomes = { path = "crates/lumilio-cubiomes" }
lumilio-plugin-world-explorer = { path = "crates/lumilio-plugin-world-explorer" }
lumilio-ui = { path = "crates/lumilio-ui" }
md-5 = "0.11"
regex = "1.11"
rsa = { version = "0.9", features = ["getrandom"] }
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha1-legacy = { package = "sha1", version = "0.10", features = ["oid"] }
sha2 = "0.11"
toml = "0.9"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
url = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# GPUI does layout, text shaping and painting on the CPU every frame; built
# without optimization it runs about 13x slower (measured: a Discover page of
# 20 rows costs 76 ms a frame unoptimized, 6 ms optimized). Dependencies are
# optimized even in dev builds; our own crates stay debuggable and fast to
# rebuild.
[profile.dev.package."*"]
opt-level = 3

# Readback colour conversion touches every pixel. Keep it vectorized in the
# development app as well; the GPUI-facing view remains unoptimized (ADR 0028).
[profile.dev.package.lumilio-schematic-render]
opt-level = 3
