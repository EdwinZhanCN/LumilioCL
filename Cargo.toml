[workspace]
members = [
    "crates/lumilio-app",
    "crates/lumilio-core",
    "crates/lumilio-minecraft",
    "crates/lumilio-docgen",
    "crates/lumilio-ui",
    "crates/lumilio-updater",
    "crates/lumilio-transfer",
    "crates/lumilio-plugin-api",
    "crates/lumilio-nbt",
    "crates/lumilio-anvil",
    "crates/lumilio-block-assets",
    "crates/lumilio-plugin-crash-analyzer",
    "crates/lumilio-plugin-litematica",
    "crates/lumilio-plugin-modrinth",
    "crates/lumilio-plugin-curseforge",
    "crates/lumilio-plugin-discord",
    "crates/lumilio-schematic",
    "crates/lumilio-schematic-render",
    "crates/lumilio-skin-render",
    "crates/lumilio-pointer",
    "crates/lumilio-backdrop",
    "crates/lumilio-cubiomes",
    "crates/lumilio-map-render",
    "crates/lumilio-plugin-world-explorer",
    "crates/lumilio-xtask",
]
resolver = "3"
exclude = ["forks/nucleation", "forks/schematic-mesher", "forks/gpui-component", "vendor/xaerotools"]

[patch.crates-io]
gpui-component = { path = "forks/gpui-component" }

[workspace.package]
version = "0.2.2"
edition = "2024"
publish = false
rust-version = "1.95"
license = "AGPL-3.0-only"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = "0.7.0"
gpui-kit = { version = "0.7.0", default-features = false, features = ["component", "assets"] }
base64 = "0.22"
flate2 = "1"
futures-util = "0.3.34"
getrandom = "0.3"
hickory-resolver = "0.25"
keyring = "4.2"
# Already built for GPUI; the launcher log (lumilio-app logging.rs) is its sink.
log = "0.4.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lumilio-core = { path = "crates/lumilio-core" }
lumilio-transfer = { path = "crates/lumilio-transfer" }
lumilio-minecraft = { path = "crates/lumilio-minecraft" }
lumilio-plugin-api = { path = "crates/lumilio-plugin-api" }
lumilio-plugin-crash-analyzer = { path = "crates/lumilio-plugin-crash-analyzer" }
lumilio-plugin-litematica = { path = "crates/lumilio-plugin-litematica" }
lumilio-plugin-modrinth = { path = "crates/lumilio-plugin-modrinth" }
lumilio-plugin-curseforge = { path = "crates/lumilio-plugin-curseforge" }
lumilio-plugin-discord = { path = "crates/lumilio-plugin-discord" }
lumilio-nbt = { path = "crates/lumilio-nbt" }
lumilio-anvil = { path = "crates/lumilio-anvil" }
lumilio-block-assets = { path = "crates/lumilio-block-assets" }
lumilio-schematic = { path = "crates/lumilio-schematic" }
lumilio-schematic-render = { path = "crates/lumilio-schematic-render" }
lumilio-skin-render = { path = "crates/lumilio-skin-render" }
lumilio-pointer = { path = "crates/lumilio-pointer" }
lumilio-backdrop = { path = "crates/lumilio-backdrop" }
lumilio-map-render = { path = "crates/lumilio-map-render" }
lumilio-cubiomes = { path = "crates/lumilio-cubiomes" }
lumilio-plugin-world-explorer = { path = "crates/lumilio-plugin-world-explorer" }
lumilio-ui = { path = "crates/lumilio-ui" }
md-5 = "0.11"
# Already built for `image`; read row by row to shrink large PNGs (lumilio-core picture.rs).
png = "0.18"
regex = "1.11"
rsa = { version = "0.9", features = ["getrandom"] }
reqwest = { version = "0.13.4", features = ["stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha1-legacy = { package = "sha1", version = "0.10", features = ["oid"] }
sha2 = "0.11"
tar = "0.4.46"
toml = "0.9"
tokio ={ version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
url = "2.5"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# `cargo build`, `cargo nextest run` and `cargo test --doc` share one set of
# artifacts: the test profile inherits dev and must not override it, or every
# dependency is compiled and stored twice. Hands-on checks use
# `cargo run --release` (default release profile).
#
# Line tables keep backtraces readable. Full debug info with macOS's unpacked
# split-debuginfo leaves an object file per codegen unit in target/, which grew
# target/debug/deps to a million files and made every rustc call scan it.
[profile.dev]
debug = "line-tables-only"

# GPUI does layout, text shaping and painting on the CPU every frame; built
# without optimization it runs about 13x slower (measured: a Discover page of
# 20 rows costs 76 ms a frame unoptimized, 6 ms optimized). Dependencies are
# optimized even in dev builds, and compiled once; our own crates stay fast to
# rebuild.
[profile.dev.package."*"]
opt-level = 3
debug = 0

# Readback colour conversion touches every pixel. Keep it vectorized in the
# development app as well; the GPUI-facing view remains unoptimized.
[profile.dev.package.lumilio-schematic-render]
opt-level = 3
