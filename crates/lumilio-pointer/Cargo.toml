[package]
name = "lumilio-pointer"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2", "objc2-core-foundation"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# Native cursor APIs require FFI. Only macos.rs/windows.rs permit audited unsafe blocks;
# all launcher/domain/UI crates retain the workspace's unsafe_code = forbid.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
