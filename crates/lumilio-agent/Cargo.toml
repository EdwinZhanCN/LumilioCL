[package]
name = "lumilio-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

# The launcher as an MCP server (plan agent-mcp): every capability an agent
# may use, built-in or external, goes through MCP. Depends on core, never on
# the UI; the application hosts the transport.
[dependencies]
lumilio-core.workspace = true
lumilio-plugin-litematica.workspace = true
lumilio-schematic.workspace = true
rmcp = { workspace = true, features = ["transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true

[lints]
workspace = true
