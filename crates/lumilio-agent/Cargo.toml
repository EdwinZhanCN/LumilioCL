[package]
name = "lumilio-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

# The launcher as an MCP server (plan agent-mcp): every capability an agent
# may use, built-in or external, goes through MCP over loopback HTTP.
# Depends on core, never on the UI; the application hosts the listener.
[dependencies]
bytes.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
lumilio-core.workspace = true
lumilio-plugin-litematica.workspace = true
lumilio-schematic.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true

[lints]
workspace = true
